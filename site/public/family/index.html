<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0b0d12">
<title data-tt="{prog} — RORUBARU">High Rollers — RORUBARU</title>
<link rel="icon" href="/icon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-icon.png">
<link rel="stylesheet" href="/loyalty/loyalty.css?v=f19">
<script src="/loyalty/vendor/qrcode.js"></script>
<script src="/loyalty/loyalty.js?v=f19"></script>
</head>
<body>
<div class="wrap" id="app" style="visibility:hidden">
  <div class="top">
    <div class="brand"><img src="/logo.png" alt="RORUBARU"><span class="fam" data-t="family"></span></div>
    <div class="langs"><button data-lang="en">EN</button><button data-lang="zh">繁中</button></div>
  </div>

  <!-- sign in -->
  <section id="signin">
    <h1 data-t="p_tag"></h1>
    <p class="muted" id="subLine"></p>
    <div class="card">
      <div id="step1">
        <label class="field"><span data-t="phone"></span><input id="phone" type="tel" inputmode="tel" autocomplete="tel" data-tp="phone_ph"></label>
        <div class="err hide" id="err1"></div>
        <button class="btn" id="btnSend" data-t="send"></button>
      </div>
      <div id="step2" class="hide">
        <p class="small muted"><span id="sentTo"></span> · <a href="#" id="changeNo" data-t="change"></a></p>
        <div class="notice hide" id="testHint"><span data-t="test_hint"></span> <b class="code" id="testCode"></b></div>
        <label class="field"><span data-t="code"></span><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" data-tp="code_ph"></label>
        <label class="field" id="nameField"><span data-t="name"></span><input id="name" type="text" autocomplete="given-name" data-tp="name_ph"></label>
        <label class="field" id="bdayField"><span data-t="bday_opt"></span><div class="row" style="gap:8px"><select id="bdM" class="sel"></select><select id="bdD" class="sel"></select></div></label>
        <label class="check" id="consentRow"><input type="checkbox" id="consent"><span><span data-t="terms_agree_a"></span> <a href="/family/terms/" target="_blank" data-t="terms_link"></a> <span data-t="and"></span> <a href="/family/privacy/" target="_blank" data-t="privacy_link"></a> <span class="req">*</span></span></label>
        <div class="optbox">
          <div class="tiny" style="margin:0 0 6px" data-t="optional_title"></div>
          <label class="check"><input type="checkbox" id="mktWa"><span data-t="mkt_wa"></span></label>
          <label class="check"><input type="checkbox" id="mktPush"><span data-t="mkt_push"></span></label>
        </div>
        <div class="err hide" id="err2"></div>
        <button class="btn" id="btnJoin" data-t="join" disabled></button>
        <p class="center small" style="margin-top:10px"><a href="#" id="resend" data-t="resend"></a></p>
      </div>
    </div>
    <p class="tiny" data-t="preview_note"></p>
  </section>

  <!-- member -->
  <section id="member" class="hide">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><h1 id="hello" style="margin-bottom:2px"></h1><p class="muted small" id="tierLine"></p></div>
      <span class="pill on" id="tierPill"></span>
    </div>

    <div class="hookbar hide" id="hookBar"></div>
    <div id="splitInbox"></div>
    <div id="suggestCard"></div>
    <!-- status (spend in the last 12 months) -->
    <div class="card status" id="statusCard">
      <div class="row" style="align-items:center;gap:12px">
        <div class="tierbadge" id="tierBadge"></div>
        <div class="grow">
          <div class="tiny" style="letter-spacing:.1em;text-transform:uppercase;margin:0" data-t="your_status"></div>
          <div style="font-size:26px;font-weight:900;line-height:1.1" id="tierName"></div>
          <div class="small muted" id="multLine"></div>
        </div>
      </div>
      <div class="tierbar"><div id="tierFill"></div></div>
      <div class="row small" style="justify-content:space-between"><span id="yearSpend"></span><span id="tierNext" style="text-align:right"></span></div>
      <div class="tiers" id="tierSteps"></div>
    </div>

    <!-- perks per tier (owner-toggleable, loyalty_perks) -->
    <div class="card hide" id="perksCard">
      <h2 style="margin-top:0" data-t="perks_title"></h2>
      <div id="perksBody"></div>
    </div>

    <!-- points (spend) -->
    <div class="card center" style="padding:22px 16px">
      <div class="tiny" style="letter-spacing:.1em;text-transform:uppercase" data-t="your_points"></div>
      <div style="font-size:64px;font-weight:900;line-height:1;margin:6px 0" id="pts">0</div>
      <div class="muted small" id="nextReward"></div>
      <div style="height:8px;border-radius:99px;background:var(--ink);margin:12px 0 4px;overflow:hidden"><div id="bar" style="height:100%;width:0;background:var(--orange);transition:width .6s"></div></div>
      <div class="notice hide" id="pendingNote"></div>
      <div class="tiny hide" id="goldLine" style="margin-top:8px;color:var(--gold)"></div>
    </div>

    <!-- visits (stamp plate) -->
    <div class="card center" id="plateCard">
      <div class="tiny" style="letter-spacing:.1em;text-transform:uppercase" data-t="your_plate"></div>
      <div class="plate-wrap"><div class="plate small-plate" id="plate"></div></div>
      <div style="font-weight:900;font-size:18px;margin-top:6px" id="plateLine"></div>
      <div class="small muted" id="plateSub"></div>
    </div>

    <div class="card" id="scanCard">
      <div id="scanIdle">
        <h2 style="margin-top:0" data-t="scan"></h2>
        <p class="muted small" data-t="scan_sub"></p>
        <label class="btn" for="photo" style="margin-top:8px">📷 <span data-t="scan"></span></label>
        <input id="photo" type="file" accept="image/*" capture="environment" class="hide">
        <p class="center small" style="margin-top:10px"><a href="#" id="typeInstead" data-t="type_instead"></a></p>
      </div>
      <div id="scanBusy" class="hide center" style="padding:10px 0">
        <img id="thumb" style="max-height:140px;border-radius:12px;display:none;margin:0 auto 10px">
        <p data-t="reading"></p>
        <div style="height:6px;border-radius:99px;background:var(--ink);overflow:hidden"><div id="ocrBar" style="height:100%;width:0;background:var(--orange);transition:width .3s"></div></div>
      </div>
      <div id="scanForm" class="hide">
        <p class="small" id="readMsg"></p>
        <label class="field"><span data-t="total"></span><input id="rTotal" type="text" inputmode="decimal" autocomplete="off"></label>
        <label class="field"><span data-t="when"></span><input id="rAt" type="datetime-local"></label>
        <label class="field"><span data-t="table"></span><input id="rTable" type="text" inputmode="numeric" autocapitalize="characters" autocomplete="off" maxlength="6"></label>
        <label class="field hide" id="rNoWrap"><span data-t="receipt_no"></span><input id="rNo" type="text" autocapitalize="characters" autocomplete="off"></label>
        <label class="field"><span data-t="shop"></span><div class="shops" id="rShops" style="margin:0"></div></label>
        <div class="err hide" id="rErr"></div>
        <button class="btn" id="rSubmit" data-t="confirm_add"></button>
        <p class="center small" style="margin-top:10px"><a href="#" id="rCancel" data-t="retake"></a></p>
      </div>
      <div id="scanDone" class="hide"></div>
    </div>

    <div id="splitOutbox"></div>
    <section id="ladderSec">
      <h2 data-t="ladder"></h2>
      <p class="small muted lad-sub" data-t="ladder_sub"></p>
      <div id="ladder"></div>
    </section>
    <div id="rewards"></div>

    <div id="extras">
      <div class="card hide" id="friendCard">
        <h2 style="margin-top:0">👯 <span data-t="friend_title"></span></h2>
        <p class="small muted" id="friendSub"></p>
        <div class="notice hide" id="invitedBy"></div>
        <div class="linkbox" id="friendLink"></div>
        <div class="row" style="gap:8px;margin-top:8px"><button class="btn sm" id="friendShare" data-t="share"></button><button class="btn ghost sm" id="friendCopy" data-t="copy"></button></div>
        <p class="tiny" id="friendStats"></p>
      </div>
      <div class="card hide" id="bdayCard">
        <h2 style="margin-top:0">🎂 <span data-t="bday_title"></span></h2>
        <div id="bdayBody"></div>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-top:0" data-t="receipts"></h2>
      <div id="history"></div>
    </div>

    <div class="card center">
      <h2 style="margin-top:0" data-t="your_code"></h2>
      <div class="qr" id="memberQr"></div>
      <p class="code" id="memberCode"></p>
      <p class="small muted" id="memberPhone"></p>
      <p class="small muted" data-t="show_staff"></p>
      <p class="tiny"><span data-t="member_since"></span> <span id="since"></span></p>
    </div>
    <div class="card" id="privacyCard">
      <h2 style="margin-top:0">🔒 <span data-t="priv_title"></span></h2>
      <div class="notice hide" id="termsNeeded"><span data-t="terms_update"></span> <button class="btn sm" id="termsAccept" data-t="accept"></button></div>
      <label class="check"><input type="checkbox" id="pWa"><span data-t="mkt_wa"></span></label>
      <label class="check"><input type="checkbox" id="pPush"><span data-t="mkt_push"></span></label>
      <p class="tiny" id="consentMeta"></p>
      <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn ghost sm" id="unsubAll" data-t="unsub_all"></button><a class="btn ghost sm" href="/family/privacy/" data-t="privacy_link"></a><a class="btn ghost sm" href="/family/terms/" data-t="terms_link"></a></div>
    </div>
    <div id="soonWrap" class="hide">
      <h2><span data-t="coming_soon"></span> <span class="pill" style="font-size:10px;vertical-align:middle">🔒</span></h2>
      <div class="soon" id="soon"></div>
    </div>
    <p class="tiny" data-t="privacy"></p>
    <p class="tiny" data-t="preview_note"></p>
    <div class="row" style="margin-top:14px"><button class="btn ghost sm" id="signout" data-t="signout"></button><button class="btn ghost sm" id="delete" data-t="delete" style="margin-left:auto;color:#ff8a6a"></button></div>
  </section>
</div>

<script>
(async function () {
  const R = window.RORU, t = R.t, $ = (s) => document.querySelector(s);
  try { if (new URLSearchParams(location.search).get("unsubscribe")) localStorage.setItem("roru_unsub", "1"); } catch (e) {}
  try { const rf = new URLSearchParams(location.search).get("ref"); if (rf && /^[A-Za-z0-9]{6,12}$/.test(rf)) localStorage.setItem("roru_ref", rf.toUpperCase()); } catch (e) {}
  await R.gate();
  $("#app").style.visibility = "visible";
  document.querySelectorAll(".langs button").forEach(b => b.onclick = () => { R.setLang(b.dataset.lang); render(); });
  const state = { token: localStorage.getItem("roru_member_token"), me: null, phone: "", cfg: null, lastPoints: null, lastStamps: null };
  R.rpc("family_features").then(fs => { state.features = fs; render(); }).catch(() => {});
  R.rpc("family_config").then(c => { state.cfg = c; if (state.me) render(); if (c.test_mode) { $("#testHint").classList.remove("hide"); $("#testCode").textContent = "135790"; } }).catch(() => {});

  const deviceId = () => { let d = localStorage.getItem("roru_dev"); if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); localStorage.setItem("roru_dev", d); } return d; };
  // ----- sign in -----
  $("#btnSend").onclick = async () => {
    const ph = $("#phone").value; $("#err1").classList.add("hide"); $("#btnSend").disabled = true;
    try { const r = await R.rpc("family_request_code", { p_phone: ph, p_lang: R.lang() }); state.phone = ph; $("#sentTo").textContent = r.phone_masked; $("#step1").classList.add("hide"); $("#step2").classList.remove("hide"); setTimeout(() => $("#code").focus(), 100); }
    catch (e) { $("#err1").textContent = R.errText(e); $("#err1").classList.remove("hide"); }
    $("#btnSend").disabled = false;
  };
  $("#phone").addEventListener("keydown", e => { if (e.key === "Enter") $("#btnSend").click(); });
  $("#changeNo").onclick = (e) => { e.preventDefault(); $("#step2").classList.add("hide"); $("#step1").classList.remove("hide"); };
  $("#resend").onclick = (e) => { e.preventDefault(); $("#btnSend").click(); R.toast("✓"); };
  $("#btnJoin").onclick = async () => {
    $("#err2").classList.add("hide"); $("#btnJoin").disabled = true;
    try {
      const r = await R.rpc("family_verify_code", { p_phone: state.phone, p_code: $("#code").value.trim(), p_consent: $("#consent").checked, p_name: $("#name").value, p_lang: R.lang(), p_device: deviceId() });
      state.token = r.token; localStorage.setItem("roru_member_token", r.token); state.me = r.member; state.lastPoints = r.member.points; render(); if (r.is_new) R.burst();
      try { const c = await R.rpc("family_set_consents", { p_token: r.token, p_terms: true, p_whatsapp: $("#mktWa").checked, p_push: $("#mktPush").checked, p_version: TERMS_V, p_wording: wording() }); state.me = c.member; render(); } catch (e) { R.toast(R.errText(e)); }
      const md = $("#bdM").value && $("#bdD").value ? $("#bdM").value + "-" + $("#bdD").value : null;
      if (md && !(r.member.birthday || {}).md) { try { const b = await R.rpc("family_set_birthday", { p_token: r.token, p_md: md }); state.me = b.member; render(); } catch (e) {} }
      await trySetReferrer(false);
    } catch (e) { $("#err2").textContent = R.errText(e); $("#err2").classList.remove("hide"); }
    $("#btnJoin").disabled = !$("#consent").checked;
  };
  $("#code").addEventListener("keydown", e => { if (e.key === "Enter") $("#btnJoin").click(); });
  $("#consent").addEventListener("change", () => { $("#btnJoin").disabled = !$("#consent").checked; });

  // ----- member -----
  let lastTouch = 0; ["pointerdown", "touchstart", "keydown"].forEach(ev => document.addEventListener(ev, () => { lastTouch = Date.now(); }, { capture: true, passive: true }));
  const guestBusy = () => Date.now() - lastTouch < 8000 || !!document.querySelector(".ask-sheet") || !!document.querySelector('.scratch[data-touched="1"]') || /^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement || {}).tagName || "");
  async function load(quiet) {
    if (!state.token) { render(); return; }
    try { const me = await R.rpc("family_me", { p_token: state.token });
      // v40: the 10 s live refresh never redraws over what the guest is doing (half-scratched nori, an open sheet, a field being typed, a tap in the last 8 s) and skips the redraw when nothing changed
      if (quiet && state.me && JSON.stringify(me) === JSON.stringify(state.me)) return;
      if (quiet && guestBusy()) return;
      state.me = me; render(); if (localStorage.getItem("roru_ref")) trySetReferrer(true); if (localStorage.getItem("roru_unsub")) { localStorage.removeItem("roru_unsub"); setConsents({ p_whatsapp: false, p_push: false, p_source: "unsubscribe" }, t("unsub_done")); $("#privacyCard").scrollIntoView(); } }
    catch (e) { if (e.code === "not_signed_in") { localStorage.removeItem("roru_member_token"); state.token = null; state.me = null; render(); } else if (!quiet) R.toast(R.errText(e)); }
  }
  const tierName = (k) => t("tier_" + (k || "nori"));
  const shops = () => (state.cfg && state.cfg.shops) || [{ id: "wanchai", name_en: "Wan Chai", name_zh: "灣仔" }, { id: "central", name_en: "Central", name_zh: "中環" }];

  const fmtHK = (n) => "HK$" + Math.round(+n || 0).toLocaleString("en-HK");
  const multTxt = (x) => (+x).toString().replace(/\.0+$/, "") + "×";
  function renderStatus(me, zh) {
    const tier = me.tier || "nori";
    $("#tierPill").textContent = tierName(tier);
    $("#tierBadge").className = "tierbadge t-" + tier; $("#tierBadge").textContent = tierName(tier).split(" ")[0].slice(0, 1);
    $("#tierName").textContent = tierName(tier);
    $("#multLine").textContent = t("mult_line", { x: multTxt(me.multiplier) });
    $("#yearSpend").textContent = t("year_spend", { n: fmtHK(me.year_spend) });
    const at = me.tiers_at || {}, ys = +me.year_spend || 0;
    let pct = 100, nextTxt = "";
    if (tier === "kama") { nextTxt = t("top_level"); }
    else if (me.kama_eligible) { nextTxt = "✨ " + t("kama_eligible"); }
    else if (me.tier_next) {
      const n = me.tier_next, from = tier === "nori" ? 0 : tier === "gohan" ? at.gohan : at.tobiko;
      pct = Math.max(2, Math.min(100, 100 * (ys - from) / Math.max(1, n.at - from)));
      nextTxt = n.name === "kama" ? t("tier_more_kama", { n: fmtHK(n.more) }) : t("tier_more", { n: fmtHK(n.more), name: tierName(n.name) });
    }
    $("#tierFill").style.width = pct + "%"; $("#tierFill").className = "t-" + tier;
    $("#tierNext").textContent = nextTxt;
    $("#tierLine").textContent = t("status_line");
    const steps = [["nori", 0], ["gohan", at.gohan], ["tobiko", at.tobiko], ["kama", at.kama]];
    $("#tierSteps").innerHTML = steps.map(([k, v]) => '<div class="tcell' + (k === tier ? " on" : "") + '"><b class="tn">' + k.charAt(0).toUpperCase() + k.slice(1) + '</b><span class="tt">' + fmtHK(v || 0) + '</span><span class="tm">' + multTxt((me.mults || {})[k] || 1) + '</span><span class="tc">' + t("points") + '</span><span class="tg">' + (k === "kama" ? t("invite_only_tag") : "&nbsp;") + "</span></div>").join("");
  }
  function renderPlate(me, zh) {
    const per = me.per_plate || 5, n = Math.min(me.stamps || 0, per), plate = me.plate || [];
    const fresh = state.lastStamps !== undefined && state.lastStamps !== null && me.visits_total > state.lastStamps;
    let html = "";
    for (let i = 0; i < per; i++) {
      const ang = -Math.PI / 2 + i * 2 * Math.PI / per, r = 78, on = i < n, gold = on && plate[i] && plate[i].gold;
      html += '<div class="slot' + (on ? " on" : "") + (on && fresh && i === n - 1 ? " new" : "") + '" style="--x:' + (Math.cos(ang) * r).toFixed(1) + "px;--y:" + (Math.sin(ang) * r).toFixed(1) + 'px">' + R.rollSvg(gold) + "</div>";
    }
    html += '<div class="count"><b>' + n + "/" + per + "</b><span>" + t("visits") + "</span></div>";
    $("#plate").innerHTML = html; $("#plate").classList.toggle("full", n >= per);
    const vr = me.visit_reward, rn = vr ? (zh ? vr.name_zh : vr.name_en) : "";
    $("#plateLine").textContent = n >= per - 1 && n < per ? t("plate_full_soon") : t("plate_line", { n: per - n, r: rn });
    $("#plateSub").textContent = (me.visited_today ? t("visited_today") : t("stamp_rule")) + (me.plates_done ? " · " + t("plates_done_n", { n: me.plates_done }) : "");
    if (fresh) { R.toast(t("stamp_added"), 2600); }
  }

  // ----- perks per tier -----
  const TIERS = ["nori", "gohan", "tobiko", "kama"];
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function renderPerks(me, zh) {
    const perks = me.perks || [], mine = TIERS.indexOf(me.tier), kd = me.kama_dinner || {};
    $("#perksCard").classList.toggle("hide", !perks.length); if (!perks.length) return;
    let h = "";
    TIERS.forEach((tr, ti) => {
      const list = perks.filter(p => p.tier === tr); if (!list.length) return;
      const open = ti <= mine;
      const TN = { nori: "Nori", gohan: "Gohan", tobiko: "Tobiko", kama: "Kama" };
      h += '<div class="perkgrp' + (open ? "" : " locked") + '"><div class="perkhead"><b>' + TN[tr] + "</b>" + (ti === mine ? '<span class="perktag you">' + t("perks_you") + "</span>" : !open ? '<span class="perktag">🔒 ' + t("perks_from", { t: TN[tr] }) + "</span>" : "") + "</div>";
      if (ti > 0) h += '<div class="perkplus">' + t("perks_plus", { t: TN[TIERS[ti - 1]] }) + "</div>";
      list.forEach(p => {
        const x = (me.mults && me.mults[tr]) || "", name = (zh ? p.name_zh : p.name_en).replace("{x}", x).replace("{p}", kd.passes != null ? kd.passes : 2);
        const det = zh ? p.detail_zh : p.detail_en;
        let extra = "";
        if (p.kind === "dinner" && open && me.tier === "kama") extra = '<span class="perkcount">' + t("perks_passes_left", { n: kd.left, m: kd.passes }) + "</span>";
        h += '<div class="perk"><span class="perkico">' + (open ? (p.emoji || "✓") : "🔒") + '</span><span class="grow"><span class="perkname">' + esc(name) + "</span>" + (det ? '<span class="perkdet">' + esc(det) + "</span>" : "") + "</span>" + extra + "</div>";
      });
      h += "</div>";
    });
    $("#perksBody").innerHTML = h;
  }
  // ----- extras: bring a friend, birthday roll, gold receipts -----
  const MONTHS_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const fillBday = (mSel, dSel, md) => { const zh = R.lang() === "zh"; mSel.innerHTML = '<option value="">' + t("month") + "</option>" + MONTHS_EN.map((m, i) => '<option value="' + String(i + 1).padStart(2, "0") + '">' + (zh ? (i + 1) + "月" : m) + "</option>").join(""); dSel.innerHTML = '<option value="">' + t("day") + "</option>" + Array.from({ length: 31 }, (_, i) => '<option value="' + String(i + 1).padStart(2, "0") + '">' + (i + 1) + "</option>").join(""); if (md) { mSel.value = md.slice(0, 2); dSel.value = md.slice(3, 5); } };
  const mdText = (md) => { const m = +md.slice(0, 2), d = +md.slice(3, 5); return R.lang() === "zh" ? m + "月" + d + "日" : d + " " + MONTHS_EN[m - 1]; };
  const inviteUrl = (code) => location.origin + "/family/?ref=" + code;
  async function trySetReferrer(silent) {
    const code = localStorage.getItem("roru_ref"); if (!code || !state.token || !state.me) return;
    const ref = state.me.referral || {}; if (!ref.on || ref.invited_by || code === state.me.member_code) { localStorage.removeItem("roru_ref"); return; }
    try { const r = await R.rpc("family_set_referrer", { p_token: state.token, p_code: code }); state.me = r.member; render(); R.toast(t("ref_linked", { n: r.member.referral.bonus }), 3500); } catch (e) { if (!silent) R.toast(R.errText(e)); }
    localStorage.removeItem("roru_ref");
  }
  function renderExtras(me, zh) {

  $("#photo").addEventListener("change", async () => {

  function setupScratch(el, id) {
