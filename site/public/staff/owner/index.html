<style>
/* v36 owner dashboard */
.dash{margin:16px 0 18px}
.dash h3{margin:0;font-size:15px;font-weight:600;color:var(--cream)}
.dash .sub{font-size:13px;color:var(--muted);margin:2px 0 0}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0 4px}
.kpi{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;min-width:0}
.kpi .lbl{font-size:13px;color:var(--muted)}
.kpi .val small{font-size:.6em;font-weight:600;margin-right:2px;color:var(--muted)}
.kpi .val{font-size:26px;font-weight:700;line-height:1.15;margin:6px 0 8px;letter-spacing:-.01em;white-space:nowrap;overflow:visible;text-overflow:clip}
/* v43: values auto-shrink to fit the card (fitKpis); 6+ digit values switch to a compact form (HK$209.5k) only if the full figure cannot fit */
.kpi .chg{font-size:12px;color:var(--muted)}
.kpi .chg b{font-weight:700;margin-right:4px}
.chg .up{color:var(--green)} .chg .down{color:#ff7a59} .chg .flat{color:var(--muted)}
.dcard{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin:14px 0}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(246,243,231,.06);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--cream);color:var(--ink);font-weight:600}
.chart{margin-top:14px;width:100%}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.dtot{font-size:13px;color:var(--muted);margin-top:6px}
.minis{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
.minis .dcard{margin:0}
.donut{display:flex;align-items:center;gap:18px}
.donut ul,.bars{list-style:none;margin:0;padding:0;font-size:13px}
.donut li{display:flex;align-items:center;gap:8px;margin:5px 0;color:var(--cream)}
.donut li span{color:var(--muted);margin-left:auto;padding-left:10px}
.bars li{margin:10px 0}
.bars .bl{display:flex;justify-content:space-between;gap:10px;color:var(--cream)}
.bars .bl span{color:var(--muted)}
.bars .bt{height:8px;background:rgba(246,243,231,.08);border-radius:6px;margin-top:5px;overflow:hidden}
.bars .bt i{display:block;height:100%;background:var(--orange);border-radius:6px}
.posbar{display:flex;height:12px;border-radius:8px;overflow:hidden;background:rgba(246,243,231,.08);margin:14px 0 10px}
.posbar i{display:block;height:100%}
.pbig{font-size:26px;font-weight:700;margin-top:10px}
.dash details{background:var(--ink2);border:1px solid var(--line);border-radius:18px;margin:14px 0;padding:0 16px}
.dash summary{cursor:pointer;padding:16px 0;font-size:15px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
.dash summary::-webkit-details-marker{display:none}
.dash summary::after{content:"Show";font-weight:400;font-size:13px;color:var(--muted)}
.dash details[open] summary::after{content:"Hide"}
.dash details .in{padding:0 0 16px}
.nums{display:grid;grid-template-columns:1fr;gap:0}
.nums div{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.nums div span{color:var(--muted);min-width:0}
.nums div{gap:10px}.nums div b,.nums div strong{white-space:nowrap}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.dash table{width:100%;border-collapse:collapse;font-size:13px}
.dash th{text-align:left;color:var(--muted);font-weight:500;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.dash td{padding:8px 10px 8px 0;border-bottom:1px solid rgba(246,243,231,.06);white-space:nowrap}
.dash td.n,.dash th.n{text-align:right}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.kpi .val{font-size:30px}.minis{grid-template-columns:repeat(3,minmax(0,1fr))}.nums{grid-template-columns:1fr 1fr;column-gap:28px}}

/* ===== f27 owner: two layouts on one URL (phone < 900px: bottom tabs + cards; desktop >= 900px: side menu + wide tables) ===== */
body.own{overflow-x:hidden}
.own .staff{max-width:none;padding:0;min-height:100svh}
.oh{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(11,13,18,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.oh .brand{min-width:0;gap:8px}
.oh .brand img{height:22px;flex:none}
.oh .brand .fam{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.oh .acts{display:flex;gap:8px;flex:none}
.icb{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--ink2);color:var(--cream);border-radius:12px;min-width:44px;height:44px;padding:0 12px;font-size:20px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.icb span{font-size:14px;font-weight:700}
#login{padding:20px 16px}
.oshell{display:block}
.views{padding:14px 16px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;min-width:0}
.view{display:none}.view.on{display:block}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 0 12px}
.vh h1{font-size:26px;margin:0}
.vh .sub{font-size:14px;color:var(--muted);margin:2px 0 0}
.sec{margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec h2{margin:0;font-size:18px}
.sec .lnk{background:none;border:0;color:var(--orange);font-size:15px;font-weight:700;cursor:pointer;padding:8px 0}
.side{display:none}
.otabs{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(11,13,18,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.otabs button{appearance:none;-webkit-appearance:none;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:12px;font-weight:700;min-height:56px;cursor:pointer}
.otabs button svg{width:25px;height:25px}
.otabs button.on{color:var(--orange)}
.otabs .badge,.side .badge{display:inline-block;min-width:18px;padding:1px 5px;border-radius:99px;background:var(--orange);color:#fff;font-size:11px;line-height:16px;text-align:center}
.otabs button{position:relative}.otabs .badge{position:absolute;top:4px;left:calc(50% + 6px)}
/* quick actions */
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.qa button{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--ink2);color:var(--cream);border-radius:16px;padding:16px 14px;min-height:76px;text-align:left;font:inherit;font-size:16px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;gap:4px;justify-content:center}
.qa button i{font-style:normal;font-size:22px}
.qa button small{font-size:13px;font-weight:500;color:var(--muted)}
.qa button.hot{border-color:var(--orange);background:rgba(246,69,1,.12)}
/* list items (cards on phone) */
.li{display:flex;align-items:center;gap:12px;background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 10px;min-width:0}
.li.tap{cursor:pointer}
.li .bd{flex:1;min-width:0}
.li .t1{font-size:16px;font-weight:900;overflow-wrap:anywhere}
.li .t2{font-size:14px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.li .t3{font-size:14px;margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 14px}
.li .t3 b{font-weight:900}
.li .chev{color:var(--muted);font-size:22px;flex:none}
.li .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.li.off{opacity:.55}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.3)}
.tchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(246,243,231,.08)}
.opill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(76,195,138,.16);color:#7fe0ad}
.opill.no{background:rgba(246,243,231,.08);color:var(--muted)}
.opill.warn{background:rgba(232,184,74,.16);color:var(--gold)}
.bigbtn{display:flex;gap:10px}
.bigbtn .btn{flex:1;padding:14px;font-size:16px}
.own .btn.sm{min-height:44px;font-size:15px}
.empty{color:var(--muted);font-size:15px;padding:6px 2px 10px}
/* search */
.search{position:relative;margin:4px 0 14px}
.search input{width:100%;font-size:17px;padding:15px 16px 15px 44px;border-radius:14px;border:1px solid rgba(246,243,231,.28);background:#1b1e27;color:var(--cream);outline:none}
.search input:focus{border-color:var(--orange)}
.search:before{content:"🔎";position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.8}
/* help "?" */
details.help{margin:0 0 12px}
details.help summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;padding:6px 0}
details.help summary::-webkit-details-marker{display:none}
details.help summary:before{content:"?";display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);font-weight:900;color:var(--cream);font-size:13px}
details.help p{font-size:15px;line-height:1.5;color:var(--cream);opacity:.85;background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 0}
/* settings groups */
details.grp{background:var(--ink2);border:1px solid var(--line);border-radius:16px;margin:0 0 10px;padding:0 14px}
details.grp>summary{list-style:none;cursor:pointer;padding:16px 0;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary:after{content:"›";font-size:22px;color:var(--muted);transition:transform .2s}
details.grp[open]>summary:after{transform:rotate(90deg)}
details.grp>.in{padding:0 0 14px}
/* fields: label above, full width, 16px+ */
.fl{display:block;margin:0 0 14px;min-width:0}
.fl>span{display:block;font-size:14px;color:var(--muted);margin:0 0 6px;font-weight:700}
.fl>em{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:5px}
.fin,.own select.fin{width:100%;min-width:0;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid rgba(246,243,231,.28);background:#1b1e27;color:var(--cream);outline:none}
.fin:focus{border-color:var(--orange)}
.own select.fin{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--cream) 50%),linear-gradient(135deg,var(--cream) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.own select.fin option{color:#0b0d12;background:#fff}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:16px}
.tog:first-child{border-top:0}
.tog .lb{min-width:0}.tog .lb small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:rgba(246,243,231,.18);transition:background .2s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i:after{transform:translateX(20px)}
.setrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow .fl{margin:0}
/* responsive tables: real tables on desktop, stacked cards on phone */
.rt td,.rt th{font-size:14px}
/* full-screen sheet (phone) / dialog (desktop) */
.sheet{position:fixed;inset:0;z-index:60;display:none;background:var(--ink)}
.sheet.show{display:flex;flex-direction:column}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line)}
.sheet .sh h2{margin:0;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .sb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
.sheet .sf{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;background:var(--ink)}
.sheet .sf .btn{flex:1}
.sheet .sf:empty{display:none}
body.noscroll{overflow:hidden}
/* ☰ menu */
.menu{position:fixed;inset:0;z-index:58;display:none;background:rgba(0,0,0,.55)}
.menu.show{display:block}
.menu .mp{position:absolute;right:0;top:0;bottom:0;width:min(340px,88vw);background:var(--ink2);border-left:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 14px 20px;overflow-y:auto}
.menu .mp h3{margin:4px 4px 14px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mi{display:flex;align-items:center;gap:14px;width:100%;appearance:none;-webkit-appearance:none;border:0;background:none;color:var(--cream);font:inherit;font-size:17px;font-weight:700;text-align:left;padding:15px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.mi i{font-style:normal;font-size:22px;width:28px;text-align:center}
.mi small{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
.mi.dim{color:var(--muted)}
@media (max-width:899px){
  .rt,.rt tbody,.rt tr,.rt td{display:block;width:100%}
  .rt tr.rh,.rt thead{display:none}
  .rt tr{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:0 0 10px}
  .rt td{border:0;padding:5px 0;display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-size:15px;text-align:right;overflow-wrap:anywhere;min-width:0}

  .rt td.t::before,.rt td[data-label=""]::before{display:none}

  .rt td .btn{width:100%}
  .dash table{white-space:normal}.dash th,.dash td{white-space:normal}
  .desk{display:none!important}
  #meMonth{width:100%}

}
@media (min-width:900px){
  .oh{padding:12px 24px}
  .oh .brand img{height:26px}.oh .brand .fam{font-size:15px}
  .phone{display:none!important}

  .side button i{font-style:normal;width:22px;text-align:center}

@media (max-width:899px){.sheet .sw0{display:flex;flex-direction:column;height:100%;width:100%}}

/* ===== f28 look: shared polish + two themes (A dark sleek, B light premium) ===== */
.purpose{font-size:14px;color:var(--muted);margin:-4px 0 14px;line-height:1.45}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 10px;line-height:1.4}
.kpi{position:relative;overflow:hidden}
.kpi .lbl{font-size:14px;font-weight:600;color:var(--cream);opacity:.88;line-height:1.25}
.kpi .val{font-size:34px;font-weight:900;letter-spacing:-.02em;margin:8px 0 4px}
.kpi .kx{font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:4px}
.kpi .kt{font-size:12.5px;font-weight:700;margin:0 0 2px}
.kpi .kt .up{color:var(--green)}.kpi .kt .down{color:#ff7a59}.kpi .kt .flat{color:var(--muted)}
.kpi .spark{display:block;width:100%;height:34px;margin:6px 0 2px}
.kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--acc,var(--orange));opacity:.9}
.k-nori{--acc:#4CC38A}.k-gohan{--acc:#F6F3E7}.k-tobiko{--acc:#F64501}.k-kama{--acc:#E8B84A}
.li .amt{font-weight:900;color:var(--orange);white-space:nowrap}
.li .idc{display:inline-block;font-size:11.5px;font-weight:500;opacity:.55;margin-left:4px;letter-spacing:.02em}
.li .why{color:var(--gold)}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view.on>*{animation:fu .38s cubic-bezier(.2,.7,.2,1) backwards}
.view.on>*:nth-child(2){animation-delay:.03s}.view.on>*:nth-child(3){animation-delay:.06s}.view.on>*:nth-child(4){animation-delay:.09s}.view.on>*:nth-child(5){animation-delay:.12s}.view.on>*:nth-child(n+6){animation-delay:.15s}
.qa button,.li.tap,.kpi,.otabs button,.side button{transition:transform .18s ease,background-color .2s ease,border-color .2s ease,box-shadow .2s ease}
.qa button:active,.li.tap:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){.view.on>*{animation:none}.qa button,.li.tap,.kpi,.otabs button,.side button{transition:none}}

/* ---- A: dark sleek ---- */
body.thA{background:#07080c radial-gradient(1100px 520px at 12% -8%,rgba(246,69,1,.16),transparent 60%) fixed,#07080c radial-gradient(800px 600px at 110% 30%,rgba(232,184,74,.07),transparent 60%) fixed;background-color:#07080c}

<script>
(async function () {
  const R = window.RORU, $ = (s) => document.querySelector(s), $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  await R.gate(); $("#app").style.visibility = "visible";
  // f28 look: A = dark sleek (default), B = light premium. ?theme=B or localStorage roru_owner_theme switches it.
  // First visit follows the phone/computer's light or dark setting; after a tap on ☀️/🌙 his choice is remembered.
  const qTh = new URLSearchParams(location.search).get("theme");
  const savedTh = localStorage.getItem("roru_owner_theme");
  const sysLight = () => window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
  function setTheme(t, save) {
    t = t === "B" ? "B" : "A"; document.body.classList.toggle("thA", t === "A"); document.body.classList.toggle("thB", t === "B");
    if (save) { try { localStorage.setItem("roru_owner_theme", t); } catch (e) {} }
    const dark = t === "A", ico = dark ? "☀️" : "🌙", lbl = dark ? "Switch to light" : "Switch to dark";
    document.querySelectorAll("[data-theme]").forEach(b => { b.setAttribute("aria-label", lbl); b.title = lbl; const i = b.querySelector("i"); if (i) i.textContent = ico; const s = b.querySelector("span"); if (s) s.textContent = dark ? "Light mode" : "Dark mode"; });
    const mc = document.querySelector('meta[name="theme-color"]'); if (mc) mc.setAttribute("content", dark ? "#07080c" : "#F4F0E4");
    document.documentElement.style.colorScheme = dark ? "dark" : "light";
    if (window.__ownerRedraw) window.__ownerRedraw();
  }
  setTheme(qTh ? String(qTh).toUpperCase() : savedTh ? savedTh : (sysLight() ? "B" : "A"), false);
  document.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => setTheme(document.body.classList.contains("thA") ? "B" : "A", true));
  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => { if (!localStorage.getItem("roru_owner_theme")) setTheme(sysLight() ? "B" : "A", false); });
  const st = { sess: JSON.parse(localStorage.getItem("roru_owner") || "null"), data: null, pin: "", view: "today", open: {} };
  const isDesk = () => window.matchMedia("(min-width:900px)").matches;
  const pad = (el, onKey) => { el.innerHTML = ""; ["1","2","3","4","5","6","7","8","9","C","0","⌫"].forEach(k => { const b = document.createElement("button"); b.textContent = k; if (k === "C" || k === "⌫") b.className = "alt"; b.onclick = () => onKey(k); el.appendChild(b); }); };
  pad($("#pinPad"), async (k) => {
    if (k === "C") st.pin = ""; else if (k === "⌫") st.pin = st.pin.slice(0, -1); else if (st.pin.length < 6) st.pin += k;
    $("#pinDisp").innerHTML = st.pin ? "•".repeat(st.pin.length) : '<span class="ph">PIN</span>'; $("#pinErr").classList.add("hide");
    if (st.pin.length === 6) { const pin = st.pin; st.pin = "";
      try { const r = await R.rpc("staff_login", { p_pin: pin }); if (r.staff.role !== "owner") throw Object.assign(new Error("owner_only"), { code: "owner_only" }); st.sess = { token: r.token, staff: r.staff }; localStorage.setItem("roru_owner", JSON.stringify(st.sess)); render(); load(); }
      catch (e) { $("#pinDisp").innerHTML = '<span class="ph">PIN</span>'; $("#pinErr").textContent = e.code === "owner_only" ? "That is a staff PIN, not the owner PIN" : (e.code === "wrong_pin" ? "Wrong PIN" : R.errText(e)); $("#pinErr").classList.remove("hide"); } }
  });
  const logout = () => { st.sess = null; st.data = null; localStorage.removeItem("roru_owner"); closeMenu(); closeSheet(); render(); };
  $("#logout").onclick = logout;
  $("#refresh").onclick = () => load();
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = (n) => Math.round(+n || 0).toLocaleString("en-US");
  const hkd2 = (n) => "HK$" + (+n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const hkd = (n) => "HK$" + fmt(n), hkdK = (n) => '<small>HK$</small>' + fmt(n);
  const when = (x) => x ? new Date(x).toLocaleString("en-GB", { timeZone: "Asia/Hong_Kong", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
  const shopNm = (id) => id === "wanchai" ? "Wan Chai" : id === "central" ? "Central" : (id || "");
  const TN = (k) => R.tierName(k || "nori", "en");
  // {x} / {p} tokens in perk text -> the real number for that level, so the owner reads what the guest reads
  const tok = (s, tier) => { const S0 = (st.data && st.data.settings) || {}; return String(s == null ? "" : s).replace(/\{x\}/g, String(S0["tier_mult_" + (tier || "nori")] || "1")).replace(/\{p\}/g, S0.kama_dinner_passes != null ? S0.kama_dinner_passes : "?"); };
  const tchip = (k) => '<span class="tchip"><span class="dot t-' + esc(k || "nori") + '"></span>' + esc(TN(k)) + "</span>";
  const help = (txt) => '<details class="help"><summary>How this works</summary><p>' + txt + "</p></details>";
  const sec = (title, right) => '<div class="sec"><h2>' + title + "</h2>" + (right || "") + "</div>";
  const vh = (title, sub, right) => '<div class="vh"><div><h1>' + title + "</h1>" + (sub ? '<p class="sub">' + sub + "</p>" : "") + "</div>" + (right || "") + "</div>";
  const fld = (label, inner, hint) => '<label class="fl"><span>' + label + "</span>" + inner + (hint ? "<em>" + hint + "</em>" : "") + "</label>";
  const inp = (name, val, extra) => '<input class="fin" name="' + name + '" value="' + esc(val) + '" ' + (extra || "") + ">";
  const area = (name, val) => '<textarea class="fin" name="' + name + '" rows="2">' + esc(val) + "</textarea>";
  const swt = (attrs, on) => '<span class="sw"><input type="checkbox" ' + attrs + (on ? " checked" : "") + "><i></i></span>";
  const tog = (label, sub, attrs, on) => '<div class="tog"><div class="lb">' + label + (sub ? "<small>" + sub + "</small>" : "") + "</div>" + swt(attrs, on) + "</div>";
  // Responsive table: real table on desktop; on phone each row becomes a stacked card (labels from the header row).
  function rt(cols, rows, opts) {
    opts = opts || {};
    return '<table class="rt"><tr class="rh">' + cols.map(c => '<th class="' + (c.c || "") + '">' + c.h + "</th>").join("") + "</tr>" +
      rows.map(r => "<tr" + (r.attrs ? " " + r.attrs : "") + ">" + r.cells.map((v, i) => '<td class="' + (cols[i].c || "") + (i === 0 && !cols[i].nt ? " t" : "") + '" data-label="' + esc(cols[i].l != null ? cols[i].l : cols[i].h.replace(/<[^>]+>/g, "")) + '">' + (v == null ? "" : v) + "</td>").join("") + "</tr>").join("") + "</table>";
  }
  function labelTables(root) { $$("table.rt", root).forEach(t => { const hr = t.querySelector("tr"); if (!hr || !hr.querySelector("th")) return; hr.classList.add("rh"); const hs = $$("th", hr).map(th => th.textContent.trim()); $$("tr", t).forEach(tr => { if (tr === hr) return; $$("td", tr).forEach((td, i) => { if (!td.hasAttribute("data-label")) td.setAttribute("data-label", hs[i] || ""); }); }); }); }
  // ----- sheet (full screen on phone, dialog on desktop) -----
  function openSheet(title, body, foot, mount) { $("#sheetB").oninput = null; $("#sheetB").onchange = null; $("#sheetT").textContent = title; $("#sheetB").innerHTML = body; $("#sheetF").innerHTML = foot || ""; $("#sheet").classList.add("show"); document.body.classList.add("noscroll"); $("#sheetB").scrollTop = 0; if (mount) mount($("#sheetB"), $("#sheetF")); }
  function closeSheet() { $("#sheet").classList.remove("show"); document.body.classList.remove("noscroll"); }
  $("#sheetX").onclick = closeSheet; $("#sheet").onclick = (e) => { if (e.target === $("#sheet")) closeSheet(); };
  // ----- ☰ menu + navigation (3 tabs: Today / Guests / Rewards; the rest behind ☰) -----
  function openMenu() { $("#menu").classList.add("show"); } function closeMenu() { $("#menu").classList.remove("show"); }
  $("#menuBtn").onclick = openMenu; $("#menu").onclick = (e) => { if (e.target === $("#menu")) closeMenu(); };
  $$("[data-logout]").forEach(b => b.onclick = logout);
  $$("[data-refresh]").forEach(b => b.onclick = () => { closeMenu(); load(); });
  $$("[data-help]").forEach(b => b.onclick = () => { closeMenu(); tour(true); });
  function go(v, keep) {
    st.view = v; window.__ppOwner = st.sess; closeMenu();
    $$(".view").forEach(x => x.classList.toggle("on", x.id === "v-" + v));
    $$("[data-go]").forEach(b => b.classList.toggle("on", b.dataset.go === v));
    placeDash(); if (!keep) window.scrollTo(0, 0);
    if (v === "today" || v === "reports") requestAnimationFrame(() => { drawChart(); fitKpis(); });
  }
  $$("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  // The full charts dashboard sits on Today on desktop and under Reports on the phone (phone Today stays quick).
  function placeDash() { const h = $("#dashHome"), tgt = isDesk() ? $("#v-today") : $("#v-reports"); if (h.parentElement !== tgt) tgt.appendChild(h); h.classList.toggle("hide", !st.data); }
  window.matchMedia("(min-width:900px)").addEventListener("change", () => { placeDash(); requestAnimationFrame(() => { drawChart(); fitKpis(); }); });
  st.shopSel = st.shopSel || "all";
  const badge = (n) => $$("[data-badge]").forEach(b => { b.textContent = n; b.classList.toggle("hide", !n); });

  // ----- data -----
  async function load() {
    if (!st.sess) return;
    const tk = { p_token: st.sess.token }, soft = (p) => p.catch(() => null);
    try {
      const r = await Promise.all([R.rpc("owner_stats", tk), soft(R.rpc("owner_dashboard", tk)), soft(R.rpc("staff_today", tk)), soft(R.rpc("staff_queue", tk)), soft(R.rpc("staff_bonus_queue", tk)), soft(R.rpc("staff_pos_queue", tk)),
        soft(R.rpc("owner_perks", tk)), soft(R.rpc("owner_upgrade_log", tk)), soft(R.rpc("owner_extras", tk)), soft(R.rpc("owner_features", tk)), soft(R.rpc("owner_access_log", { p_token: st.sess.token, p_limit: 30 }))]);
      [st.data, st.dash, st.today, st.queue, st.bq, st.pos, st.perks, st.ulog, st.extras, st.features, st.alog] = r;
    } catch (e) { if (e.code === "staff_not_signed_in" || e.code === "owner_only") { logout(); return; } R.toast(R.errText(e)); return; }

      '<circle cx="' + pts[n - 1][0].toFixed(1) + '" cy="' + pts[n - 1][1].toFixed(1) + '" r="2.6" fill="' + col + '"/></svg>';

      '<text x="' + (L + w + 6) + '" y="' + (yy + 4) + '" font-size="11" fill="rgba(232,184,74,.75)">' + kfmt(Math.round(sMax * k / 2)) + "</text>"; }

      '<details><summary>More numbers</summary><div class="in"><div class="nums">' + [["Members", fmt(d.members)], ["Guest visits today", fmt(d.visits_today)], ["Bills scanned today", fmt(d.receipts_today)], ["Bills waiting for approval", fmt(d.pending)], ["Guest visits, all time", fmt(d.visits_all)], ["Visits stamped without a bill", fmt(d.visits_only_all)], ["Free visit items earned", fmt(d.plates_completed)], ["Bills scanned, all time", fmt(d.receipts_all)], ["Bills rejected", fmt(d.rejected)], ["Members spent, all time", hkd(d.spend_all)], ["Points given out, all time", fmt(d.points_issued)], ["Points guests still hold", fmt(d.points_outstanding)], ["Rewards earned, not used yet", fmt(d.rewards_earned)], ["Free items claimed, all time", fmt(d.rewards_redeemed)], ["Can be invited to Kama", fmt(d.kama_eligible.length)]].map(r => "<div>" + r[0] + "<span>" + r[1] + "</span></div>").join("") + "</div>" +
        '<h3 style="margin-top:18px">By shop, all time</h3><div style="margin-top:8px"><table class="rt"><tr><th>Shop</th><th class="n">Guest visits</th><th class="n">Bills</th><th class="n">Members spent</th><th class="n">Free items claimed</th></tr>' + d.per_shop.map(s => "<tr><td>" + esc(shopNm(s.shop)) + '</td><td class="n">' + fmt(s.visits) + '</td><td class="n">' + fmt(s.receipts) + '</td><td class="n">' + hkd(s.spend) + '</td><td class="n">' + fmt(s.redeemed) + "</td></tr>").join("") + "</table></div></div></details>" +
      '<details><summary>Day by day · last 30 days</summary><div class="in"><table class="rt"><tr><th>Day</th><th>Shop</th><th class="n">Guest visits</th><th class="n">Bills</th><th class="n">Members spent</th></tr>' +
        (Object.keys(days).sort().reverse().map(k => days[k].map((r, n) => "<tr><td>" + (n ? "" : R.fmtDay ? R.fmtDay(k) : k) + "</td><td>" + shopNm(r.shop) + '</td><td class="n">' + fmt(r.visits) + '</td><td class="n">' + fmt(r.receipts) + '</td><td class="n">' + hkd(r.spend) + "</td></tr>").join("")).join("") || '<tr><td colspan="5" class="muted">Nothing yet</td></tr>') + "</table></div></details>";
    document.querySelectorAll("#dSeg button").forEach(b => b.onclick = () => { st.shopSel = b.dataset.shop; drawChart(); });
    requestAnimationFrame(() => { drawChart(); fitKpis(); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitKpis);
    setTimeout(fitKpis, 700); setTimeout(fitKpis, 2000);
  }
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", () => fitKpis());
  function fitKpis() {
    document.querySelectorAll(".kpi .val[data-f]").forEach(el => {
      const ok = () => el.scrollWidth <= el.clientWidth + 0.5;
      const shrink = (min) => { let f = parseFloat(getComputedStyle(el).fontSize); while (!ok() && f > min) { f -= 1; el.style.fontSize = f + "px"; } };
      el.style.whiteSpace = ""; el.style.fontSize = ""; el.innerHTML = el.dataset.f; el.title = "";
      if (!el.clientWidth) return;
      shrink(19);
      if (!ok() && el.dataset.s !== el.dataset.f) { el.style.fontSize = ""; el.innerHTML = el.dataset.s; el.title = el.dataset.f.replace(/<[^>]+>/g, ""); shrink(16); }
      shrink(12);
      if (!ok()) el.style.whiteSpace = "normal";
    });
  }
  window.__ownerRedraw = () => { if (st.data) requestAnimationFrame(() => { try { drawChart(); } catch (e) {} }); };
  let rzT = null; window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { drawChart(); fitKpis(); }, 150); });
  
  function render() { const on = !!st.sess; $("#login").classList.toggle("hide", on); $("#main").classList.toggle("hide", !on); ["#logout", "#refresh", "#menuBtn"].forEach(s => $(s).classList.toggle("hide", !on)); }
  render(); load();
})();
</script>
