<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roru Staff">
<title data-tt="{prog} · Staff — RORUBARU">High Rollers · Staff — RORUBARU</title>
<link rel="manifest" href="/loyalty/staff.webmanifest">
<link rel="icon" href="/icon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-icon.png">
<link rel="stylesheet" href="/loyalty/loyalty.css?v=f29">
<link rel="stylesheet" href="/loyalty/passport.css?v=f29">
<script src="/loyalty/vendor/qrcode.js"></script>
<script src="/loyalty/loyalty.js?v=f29"></script>
<script src="/loyalty/passport.js?v=f29"></script>

<style>body{overscroll-behavior:none}
.gcard{border:1px solid var(--line);background:var(--ink2);border-radius:18px;padding:14px 16px;margin:0 0 12px}
.gcard .gh{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.gcard .gn{font-size:22px;font-weight:900;line-height:1.15}
.gcard .bd{display:inline-block;padding:3px 10px;border-radius:99px;background:rgba(232,184,74,.16);color:var(--gold);font-size:13px;font-weight:900}
.gcard .gl{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:16px}
.gcard .gl b{font-weight:900;letter-spacing:.01em}
.gcard .gl .k{color:var(--muted);font-size:13px;margin-right:6px}
.gcard .gs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.gcard .gs div{background:rgba(246,243,231,.05);border-radius:12px;padding:8px 10px;min-width:0}
.gcard .gs small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gs b{display:block;font-size:19px;font-weight:900;margin-top:2px;white-space:nowrap}
.gcard .gx{margin-top:10px;font-size:14.5px;line-height:1.45}
.gcard .gx .k{color:var(--muted)}
.gcard details{margin-top:8px;font-size:13.5px;color:var(--muted)}
.gcard summary{cursor:pointer;color:var(--cream);font-size:13.5px;list-style:none;display:inline-block;padding:2px 0}
.gcard summary::-webkit-details-marker{display:none}
.gcard .lg{margin-top:8px;font-size:11px;color:var(--muted)}
.oktoast{display:flex;align-items:flex-start;gap:10px;background:rgba(76,195,138,.14);border:1px solid rgba(76,195,138,.55);border-radius:14px;padding:10px 14px;margin:0 0 10px;font-size:15px;line-height:1.35;animation:okin .25s ease-out}
.oktoast .oi{font-size:22px;line-height:1}
.oktoast b{display:block;font-size:17px;font-weight:900;color:var(--cream)}
.oktoast span.os{color:var(--muted)}
@keyframes okin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.closein{display:inline-block;margin:0 0 10px;padding:6px 12px;border-radius:99px;background:rgba(246,243,231,.08);color:var(--muted);font-size:14px;font-weight:700}
#doneBtn{margin-top:12px;min-height:66px;background:var(--green);color:var(--ink);font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#doneBtn small{font-size:13px;font-weight:700;opacity:.8}
@media (max-width:520px){.gcard .gs{grid-template-columns:repeat(2,1fr)}.gcard .gn{font-size:20px}}
</style>
</head>
<body>
<div class="staff" id="app" style="visibility:hidden">
  <div class="top">
    <div class="brand"><img src="/logo.png" alt="RORUBARU"><span class="fam" data-t="staff_brand">High Rollers · Staff</span></div>
    <div class="row">
      <span class="pill" id="who"></span>
      <div class="langs"><button data-lang="en">EN</button><button data-lang="zh">繁中</button></div>
      <button class="btn ghost sm hide" id="helpBtn" type="button" title="How it works" aria-label="How it works">?</button>
      <button class="btn ghost sm hide" id="logout">⏻</button>
    </div>
  </div>

  <!-- PIN login -->
  <section id="login" class="pin" style="max-width:460px;margin:0 auto">
    <h1 data-t="s_login"></h1>
    <p class="muted small" data-t="s_login_sub"></p>
    <div class="shops" id="shops"></div>
    <div class="display" id="pinDisp"><span class="ph" data-t="s_pin_ph"></span></div>
    <div class="err hide" id="pinErr"></div>
    <div class="pad" id="pinPad"></div>
  </section>

  <!-- main -->
  <section id="main" class="hide">
    <div class="cols">
      <div>
        <div class="display" id="disp"><span class="ph" data-t="s_type"></span></div>
        <div class="pad" id="pad"></div>
        <div class="row" style="margin-top:12px;gap:8px">
          <button class="btn ghost sm" id="scanBtn">📷 <span data-t="s_scan"></span></button>
          <button class="btn ghost sm" id="queueBtn" style="margin-left:auto">⏳ <span data-t="s_queue"></span> <b id="queueN"></b></button>
        </div>
        <div class="cam" id="cam"><video id="video" playsinline muted autoplay></video><div class="frame"></div></div>
      </div>
      <div>
        <div id="closeIn" class="closein hide" aria-live="polite"></div>
        <div id="members" class="members"></div>
        <div id="actions" class="hide">
          <div id="okToast" class="oktoast hide" role="status"></div>
          <div id="gcard" class="gcard hide"></div>
          <div class="big">
            <button class="btn" id="addRoll">🧾 <span data-t="s_add"></span><small id="addSub"></small></button>
            <button class="btn ghost" id="visitBtn">🍣 <span data-t="s_visit"></span><small id="visitSub"></small></button>
            <button class="btn gold" id="redeemBtn" style="grid-column:1 / -1;min-height:80px">🎁 <span data-t="s_redeem"></span><small id="redeemSub"></small></button>
          </div>
          <button class="btn" id="doneBtn"><span data-t="s_done"></span><small id="doneSub" class="hide"></small></button>
          <label class="check small hide" id="demoRow" style="margin-top:10px"><input type="checkbox" id="demo"><span data-t="s_demo"></span></label>
          <div id="award" class="card hide">
            <label class="field"><span data-t="s_total"></span><input id="aTotal" type="text" inputmode="decimal" autocomplete="off" style="font-size:28px;font-weight:900"></label>
            <label class="field"><span data-t="s_rno"></span><input id="aNo" type="text" autocapitalize="characters" autocomplete="off"></label>
            <div class="err hide" id="aErr"></div>
            <div class="row"><button class="btn" id="aGo" data-t="s_award"></button><button class="btn ghost sm" id="aBack" data-t="s_back"></button></div>
          </div>
          <div id="pending" class="members"></div>
        </div>
        <div id="queue" class="card hide"><h2 style="margin-top:0" data-t="s_queue"></h2><div id="queueList" class="members"></div></div>
        <div class="card pos" id="posCard"><div class="row" style="align-items:center"><h2 style="margin:0" class="grow">🧾 <span data-t="s_pos"></span> <span class="badge hide" id="posN"></span></h2><span class="muted small" data-t="s_pos_sub"></span></div><div id="posList"></div></div>
        <div class="card hide" id="monthCard"></div>
        <div class="log card" id="logCard">
          <div class="row"><h2 style="margin:0" class="grow"><span data-t="s_today"></span> · <span id="shopName"></span></h2><span class="muted small" id="todayNums"></span></div>
          <div id="log"></div>
        </div>
      </div>
    </div>
    <p class="tiny" data-t="preview_note"></p>
  </section>
</div>

<div class="result" id="result"><div class="box"><div class="big-ico" id="rIco"></div><h1 id="rTitle"></h1><p id="rSub" style="font-size:18px"></p><button class="btn" id="rOk" style="margin-top:18px;max-width:320px;margin-left:auto;margin-right:auto">OK</button></div></div>

      s_add: "ADD BILL", g_life: "Lifetime spend", g_12m: "Last 12 months", g_visits: "Visits", g_avg: "Avg / visit", g_last: "Last visit", g_fav: "Favourites", g_more: "More", g_since: "Member since", g_receipts: "Approved receipts", g_code: "Member code", g_bday: "Birthday", g_nobday: "not given", g_bd_today: "🎂 Birthday today!", g_bd_week: "🎂 Birthday this week", g_bd_month: "🎂 Birthday month", g_today: "today", g_yday: "yesterday", g_ago: "{n} days ago", g_never: "no visits yet", g_hand: " hand roll", g_logged: "Guest views are logged for privacy (PDPO).", g_loading: "Loading guest…", s_visit: "VISIT ONLY", s_visit_sub: "stamp, no bill", s_add_sub2: "points + visit stamp", r_stamp: "+1 visit stamp", r_stamp_already: "Visit already stamped today", r_plate: "Plate full — visit reward unlocked!", r_visit_title: "Visit stamped 🍣", s_stamps: "stamps", s_bonus_checks: "Friend bonus checks", s_each: "each", r_gold_receipt: "✨ GOLD RECEIPT", s_rate: "earned at", s_now: "now", s_visit_log: "visit stamp", s_redeem: "REDEEM", s_today: "Today", s_queue: "To approve", s_total: "Bill total HK$", s_rno: "Receipt no. (optional)", s_award: "Add points", s_approve: "Approve", s_reject: "Reject", s_queue_empty: "Nothing waiting", s_pts: "pts", r_points: "+{n} points", s_back: "Back", s_find: "Type at least 4 digits", s_none: "No member found — ask them to join at rorubaru.com/family", s_already: "Already has today's roll", s_visited: "today ✓",
      r_added: "+1 roll", r_gold: "GOLD ROLL!", r_gold_sub: "Give the gold treat 🎉", r_bonus: "+1 bonus roll (streak)", r_full: "Plate full — reward unlocked", r_full_sub: "They scratch the nori on their phone", r_redeemed: "Redeemed ✓", r_already: "Already got today's roll", r_already_sub: "One roll per guest per day", r_err: "Didn't work", r_already_redeemed: "Already redeemed", r_already_redeemed_sub: "This reward was already used. Only a manager can reverse it.", r_receipt_used: "This receipt was already added", s_log_redeem: "redeemed", s_log_rejected: "rejected", s_log_staff: "(staff)", s_not_scratched: "not scratched yet", sg_next: "next reward", sg_first: "first reward",

      s_add: "加單", g_life: "累計消費", g_12m: "過去 12 個月", g_visits: "到訪次數", g_avg: "每次平均", g_last: "上次到訪", g_fav: "最愛", g_more: "更多", g_since: "入會日期", g_receipts: "已批核收據", g_code: "會員編號", g_bday: "生日", g_nobday: "未提供", g_bd_today: "🎂 今日生日！", g_bd_week: "🎂 本星期生日", g_bd_month: "🎂 生日月", g_today: "今日", g_yday: "昨日", g_ago: "{n} 日前", g_never: "未有到訪", g_hand: "手卷", g_logged: "查閱會員資料會被記錄（私隱條例）。", g_loading: "載入中…", s_visit: "只蓋到訪印", s_visit_sub: "無單據，只蓋印", s_add_sub2: "積分 + 到訪印", r_stamp: "+1 到訪印", r_stamp_already: "今日已蓋過到訪印", r_plate: "集齊一碟 — 到訪獎賞解鎖！", r_visit_title: "已蓋到訪印 🍣", s_stamps: "個印", s_bonus_checks: "朋友獎賞核實", s_each: "每人", r_gold_receipt: "✨ 金色收據", s_rate: "倍數", s_now: "升至", s_visit_log: "到訪印", s_redeem: "兌換", s_today: "今日", s_queue: "待批核", s_total: "帳單總額 HK$", s_rno: "收據號碼（可選）", s_award: "加積分", s_approve: "批核", s_reject: "拒絕", s_queue_empty: "沒有待批核", s_pts: "分", r_points: "+{n} 分", s_back: "返回", s_find: "請輸入至少 4 位數字", s_none: "找不到會員 — 請客人到 rorubaru.com/family 加入", s_already: "今日已加過", s_visited: "今日 ✓",
      r_added: "+1 手卷", r_gold: "金色手卷！", r_gold_sub: "請送上金色小禮 🎉", r_bonus: "+1 額外手卷（連續到訪）", r_full: "集齊一碟 — 獎賞解鎖", r_full_sub: "客人在手機刮開紫菜", r_redeemed: "已兌換 ✓", r_already: "今日已經加過", r_already_sub: "每位客人每日一個手卷", r_err: "未能完成", r_already_redeemed: "已兌換", r_already_redeemed_sub: "此獎賞已經用咗，只有經理可以退回。", r_receipt_used: "此收據已經加過", s_log_redeem: "已兌換", s_log_rejected: "已拒絕", s_log_staff: "（店員）", s_not_scratched: "未刮開", sg_next: "下一份獎賞", sg_first: "第一份獎賞",
      wrong_pin: "PIN 錯誤", locked_try_later: "嘗試太多次 — 請等 15 分鐘", pending_none: "沒有可兌換的獎賞", rolls_lbl: "手卷", cam_err: "無法使用相機 — 請輸入號碼", logout: "登出", s_pos: "POS 記錄", s_pos_sub: "先在 POS 入單，再按一下", s_pos_give: "送出", s_pos_ring: "POS 入單", s_pos_log: "已入 POS ✓", s_pos_done: "已記錄", s_pos_not: "未記錄", s_pos_none: "暫時沒有", s_upgraded: "已升級", s_from: "客人原本換", s_pos_more: "再顯示 {n} 項", s_done: "完成 ✓ 下一位", s_closing: "{n} 秒後關閉", s_closing_long: "{n} 秒無操作會自動關閉" } };
  const t = (k, v) => { let s = (S[R.lang()] && S[R.lang()][k]) || S.en[k]; if (!s) return t0(k, v); if (v) for (const x in v) s = s.replace("{" + x + "}", v[x]); return s.split("{prog}").join(R.prog()); };
  await R.gate(); $("#app").style.visibility = "visible";
  document.querySelectorAll(".langs button").forEach(b => b.onclick = () => { R.setLang(b.dataset.lang); render(); });
  const st = { sess: JSON.parse(localStorage.getItem("roru_staff") || "null"), cfg: null, shop: localStorage.getItem("roru_shop") || "wanchai", pin: "", num: "", members: [], sel: null, me: null, today: null, stream: null };
  try { st.cfg = await R.rpc("family_config"); } catch (e) {}
  if (st.cfg && st.cfg.env !== "live") document.querySelector("#demoRow").classList.remove("hide");
  const shops = (st.cfg && st.cfg.shops) || [{ id: "wanchai", name_en: "Wan Chai", name_zh: "灣仔" }, { id: "central", name_en: "Central", name_zh: "中環" }];
  const shopName = (id) => { const s = shops.find(x => x.id === id) || shops[0]; return R.lang() === "zh" ? s.name_zh : s.name_en; };

  const pad = (el, onKey) => { el.innerHTML = ""; ["1","2","3","4","5","6","7","8","9","C","0","⌫"].forEach(k => { const b = document.createElement("button"); b.textContent = k; if (k === "C" || k === "⌫") b.className = "alt"; b.onclick = () => onKey(k); el.appendChild(b); }); };
  // ---- login ----
  function renderShops() { $("#shops").innerHTML = shops.map(s => '<button data-id="' + s.id + '" class="' + (s.id === st.shop ? "on" : "") + '">' + (R.lang() === "zh" ? s.name_zh : s.name_en) + "</button>").join(""); $("#shops").querySelectorAll("button").forEach(b => b.onclick = () => { st.shop = b.dataset.id; localStorage.setItem("roru_shop", st.shop); renderShops(); }); }
  pad($("#pinPad"), async (k) => {
    if (k === "C") st.pin = ""; else if (k === "⌫") st.pin = st.pin.slice(0, -1); else if (st.pin.length < 6) st.pin += k;
    $("#pinDisp").innerHTML = st.pin ? "•".repeat(st.pin.length) : '<span class="ph">' + t("s_pin_ph") + "</span>"; $("#pinErr").classList.add("hide");
    // personal PINs are 6 digits; the shared counter PIN is 4 digits: a 4-digit entry signs in after a short pause
    clearTimeout(st.pinT); if (st.pin.length === 4) { st.pinT = setTimeout(() => { if (st.pin.length === 4) submitPin(); }, 1300); return; }
    if (st.pin.length === 6) submitPin();
  });
  async function submitPin() { { const pin = st.pin; st.pin = "";
      try { const r = await R.rpc("staff_login", { p_pin: pin, p_shop: st.shop }); st.sess = { token: r.token, staff: r.staff }; localStorage.setItem("roru_staff", JSON.stringify(st.sess)); $("#pinDisp").innerHTML = '<span class="ph">PIN</span>'; render(); loadToday(); }
      catch (e) { $("#pinDisp").innerHTML = '<span class="ph">PIN</span>'; $("#pinErr").textContent = t(e.code) || R.errText(e); $("#pinErr").classList.remove("hide"); } }
  }
  $("#logout").onclick = () => { st.sess = null; localStorage.removeItem("roru_staff"); st.num = ""; st.members = []; st.sel = null; render(); };

  // ---- main keypad ----
  let lookupT = null;
  pad($("#pad"), (k) => {
    if (k === "C") { st.num = ""; st.sel = null; } else if (k === "⌫") st.num = st.num.slice(0, -1); else if (st.num.length < 12) st.num += k;
    renderDisp(); clearTimeout(lookupT); lookupT = setTimeout(lookup, 250);
  });
  function renderDisp() { $("#disp").innerHTML = st.num ? st.num.replace(/(\d{4})(?=\d)/g, "$1 ") : '<span class="ph">' + t("s_type") + "</span>"; }
  async function lookup() {
    st.sel = null; $("#actions").classList.add("hide");
    const digits = st.num.replace(/\D/g, "");
    if (digits.length < 4 && !/^[A-Z0-9]{8}$/.test(st.num)) { st.members = []; $("#members").innerHTML = st.num ? '<p class="muted small">' + t("s_find") + "</p>" : ""; return; }
    try { st.members = await R.rpc("staff_lookup", { p_token: st.sess.token, p_query: st.num }); } catch (e) { if (e.code === "staff_not_signed_in") { $("#logout").click(); return; } st.members = []; }
    renderMembers(); if (st.members.length === 1 && (digits.length >= 8 || st.members[0].member_code === st.num)) select(st.members[0]);
  }
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const tierName = (k) => R.t("tier_" + (k || "nori"));
  const mult = (x) => (+x || 1).toString().replace(/\.0+$/, "") + "×";
  // "💡 Suggest" line (v36): the SAME server pick as the guest's "Suggested for you" card (lf_suggest); no phone, no points
  function sugLine(sg, m) {
    if (!sg || !sg.on || !sg.reward) return "";
    const zh = R.lang() === "zh";
    const rn = (r) => zh ? r.name_zh : (() => { let s = r.name_en.replace(/ on us$/i, ""); return /^(Any|A|An) /.test(s) ? s[0].toLowerCase() + s.slice(1) : s; })();
    const v = (n) => zh ? (n === 1 ? "1 次" : /4/.test(String(n)) ? "幾次" : n + " 次") : (n === 1 ? "1 visit" : /4/.test(String(n)) ? "a few visits" : n + " visits");
    const f = sg.fav ? (zh ? (sg.fav.name_zh || sg.fav.name_en) + (sg.fav.kind === "roll" ? "手卷" : "") : sg.fav.name_en + (sg.fav.kind === "roll" ? " hand roll" : "")) : "";
    const likes = f ? (zh ? "鍾意" + f : "likes " + f) : "";
    const now = (r) => zh ? "今晚可換" + rn(r) : "can use " + rn(r) + " now";
    const away = (n, r) => zh ? "再嚟 " + v(n) + "可換" + rn(r) : v(n) + " from " + rn(r);
    let parts = [], lead = zh ? "💡 推介：" : "💡 Suggest: ";
    switch (sg.case) {
      case "fav_ready": parts = [likes, now(sg.reward)]; break;
      case "fav_save": parts = [likes, away(sg.visits, sg.reward)]; if (sg.alt) parts.push(now(sg.alt)); break;
      case "save_next": parts = [likes, away(1, sg.reward), now(sg.alt)]; break;
      case "ready": if (likes) parts = [likes, now(sg.reward)]; else { lead = zh ? "💡 今晚可換：" : "💡 Can use now: "; parts = [rn(sg.reward)]; } break;
      default: { const k = m && +m.used_rewards > 0 ? "sg_next" : "sg_first"; parts = [likes, zh ? t(k) + "係" + rn(sg.reward) + "，再嚟 " + v(sg.visits) : t(k) + " " + rn(sg.reward) + ", " + v(sg.visits) + " away"]; }
    }

    await select(m);
  }
  async function refreshSel() { if (!st.sel) return; try { const m = await R.rpc("staff_guest", { p_token: st.sess.token, p_who: st.sel.member_code }); if (m && m.member_code) await stayOn(m); } catch (e) { loadCard(st.sel); } }
  function ok(ico, title, sub, ms) { const el = $("#okToast"); el.innerHTML = '<span class="oi">' + ico + "</span><div><b>" + esc(title) + "</b>" + (sub ? '<span class="os">' + esc(sub) + "</span>" : "") + "</div>"; el.classList.remove("hide"); el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; clearTimeout(el._t); el._t = setTimeout(() => el.classList.add("hide"), ms || 6000); }
  // privacy: the open guest closes itself after N s with no taps (owner setting staff_card_timeout_s: 30/60/90/120, default 60). PIN session stays.
  let idleAt = Date.now();
  function bump() { idleAt = Date.now(); }
  ["pointerdown", "touchstart", "keydown", "input", "wheel"].forEach(ev => document.addEventListener(ev, bump, { capture: true, passive: true }));
  const idleSecs = () => { const v = +(st.ui && st.ui.card_timeout_s); return [30, 60, 90, 120].includes(v) ? v : 60; };
  async function loadUi() { if (!st.sess) return; try { st.ui = await R.rpc("staff_ui_settings", { p_token: st.sess.token }); } catch (e) {} }
  function closeGuest() { reset(); $("#doneSub").textContent = ""; $("#doneSub").classList.add("hide"); $("#okToast").classList.add("hide"); $("#closeIn").classList.add("hide"); $("#queue").classList.add("hide"); bump(); }
  $("#doneBtn").onclick = () => closeGuest();
  setInterval(() => {
    const open = !!(st.sess && (st.sel || st.members.length));
    const ci = $("#closeIn"), ds = $("#doneSub");
    if (!open) { ci.classList.add("hide"); ds.classList.add("hide"); return; }
    const left = Math.ceil(idleSecs() - (Date.now() - idleAt) / 1000);
    if (left <= 0) { closeGuest(); return; }
    if (left <= 10) { ci.textContent = "⏱ " + t("s_closing", { n: left }); ci.classList.remove("hide"); ds.textContent = t("s_closing", { n: left }); ds.classList.remove("hide"); }
    else { ci.classList.add("hide"); ds.textContent = t("s_closing_long", { n: idleSecs() }); ds.classList.remove("hide"); }
  }, 250);
  function reset() { st.num = ""; st.sel = null; st.members = []; renderDisp(); $("#members").innerHTML = ""; $("#actions").classList.add("hide"); $("#award").classList.add("hide"); $("#pending").innerHTML = ""; $("#gcard").classList.add("hide"); $("#gcard").innerHTML = ""; st.card = null; }
  function show(ico, title, sub, cls) { $("#rIco").textContent = ico; $("#rTitle").textContent = title; $("#rSub").textContent = sub; const el = $("#result"); el.className = "result show " + cls; clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 4000); }
  $("#rOk").onclick = () => $("#result").classList.remove("show"); $("#result").onclick = (e) => { if (e.target === $("#result")) $("#result").classList.remove("show"); };

  // ---- today log ----
  async function loadToday() { if (!st.sess) return; loadPos(); loadUi(); try { st.today = await R.rpc("staff_today", { p_token: st.sess.token }); } catch (e) { return; } renderToday(); }
  function renderToday() { if (!st.today) return; $("#shopName").textContent = shopName(st.shop); $("#todayNums").textContent = st.today.receipts + " 🧾 · " + (st.today.visits || 0) + " 🍣 · " + st.today.points + " " + t("s_pts") + " · " + st.today.redeemed + " 🎁"; $("#queueN").textContent = (st.today.pending + (st.today.pending_bonuses || 0)) || ""; $("#log").innerHTML = st.today.log.slice(0, 30).map(l => '<div class="hist"><span>' + R.fmtTime(l.at) + " · " + l.who + (l.reward ? " · " + (R.lang() === "zh" && l.reward_zh ? l.reward_zh : l.reward) : "") + (l.amount ? " · HK$" + (+l.amount).toFixed(0) : "") + "</span><span>" + (l.type === "points" ? "+" + l.points + " " + t("s_pts") + (l.stamped ? " + 🍣" : "") + (l.source === "staff" ? " " + t("s_log_staff") : "") : l.type === "visit" ? "🍣 " + t("s_visit_log") : l.type === "redeem" ? "🎁 " + t("s_log_redeem") : l.type === "rejected" ? "✕ " + t("s_log_rejected") : l.type) + "</span></div>").join("") || '<p class="muted small">—</p>'; }

  // ---- QR scan (camera; BarcodeDetector first, jsQR fallback) ----
  let scanning = false, raf = null;
  $("#scanBtn").onclick = async () => { if (scanning) return stopScan(); try { await startScan(); } catch (e) { R.toast(t("cam_err"), 3000); stopScan(); } };
  async function startScan() {
    const v = $("#video"); st.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false }); v.srcObject = st.stream; await v.play(); $("#cam").classList.add("show"); scanning = true;
    let det = null; if ("BarcodeDetector" in window) { try { det = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { det = null; } }
    if (!det && !window.jsQR) await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "/loyalty/vendor/jsQR.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
    const tick = async () => { if (!scanning) return; let text = null;
      if (v.readyState >= 2) { if (det) { try { const codes = await det.detect(v); if (codes.length) text = codes[0].rawValue; } catch (e) {} } else { cv.width = v.videoWidth / 2; cv.height = v.videoHeight / 2; cx.drawImage(v, 0, 0, cv.width, cv.height); const img = cx.getImageData(0, 0, cv.width, cv.height); const c = jsQR(img.data, img.width, img.height); if (c) text = c.data; } }
      if (text) { onCode(text); return; } raf = setTimeout(tick, 150); };
    tick();
  }
  function stopScan() { scanning = false; clearTimeout(raf); if (st.stream) st.stream.getTracks().forEach(tr => tr.stop()); st.stream = null; $("#cam").classList.remove("show"); }
  function onCode(text) { stopScan(); const m = /^RF:([A-Z0-9]{8})$/.exec(text.trim()); const r = /^RR:(R[A-Z0-9]{7})$/.exec(text.trim()); if (m) { st.num = m[1]; renderDisp(); lookup(); } else if (r) { redeem(r[1]); } else R.toast("?"); }

  function render() { R.applyI18n(); document.querySelectorAll("[data-t]").forEach(el => { if (S.en[el.dataset.t]) el.textContent = t(el.dataset.t); }); renderShops();
    const on = !!st.sess; $("#login").classList.toggle("hide", on); $("#main").classList.toggle("hide", !on); $("#logout").classList.toggle("hide", !on); $("#helpBtn").classList.toggle("hide", !on); if (on && !window.__stour) { window.__stour = 1; setTimeout(() => staffTour(false), 1200); }
    $("#who").textContent = on ? st.sess.staff.name + (st.sess.staff.role && st.sess.staff.role !== "staff" ? " (" + (st.sess.staff.role === "owner" ? "Owner" : "Manager") + ")" : "") + " · " + shopName(st.shop) : ""; $("#monthCard").classList.toggle("hide", !(on && ["manager", "owner"].includes(st.sess.staff.role))); if (on && ["manager", "owner"].includes(st.sess.staff.role) && !st.meMounted) { st.meMounted = true; window.RORU_MONTHEND.mount($("#monthCard"), () => st.sess.token); } if (!on) st.meMounted = false; renderDisp(); renderToday(); renderPos(true); if (on && st.card && st.sel) { renderCard(st.card); renderMembers(); } }
  document.addEventListener("roru:lang", () => { render(); });
  render(); if (st.sess) { try { await R.rpc("staff_today", { p_token: st.sess.token }); } catch (e) { if (e.code === "staff_not_signed_in") { st.sess = null; localStorage.removeItem("roru_staff"); render(); } } loadToday(); }
  setInterval(() => { if (document.visibilityState === "visible" && st.sess) loadToday(); }, 30000);
})();

  // ===== f29: first-time staff walkthrough, 8 steps (Dominic 19:06 Oct 15: "staff also needs tutorial"); once per device, replay with ? at the top =====
  // Steps 3, 4 and 6 point at the guest card's own buttons. With no guest open, the tour shows a SAMPLE card (no lookup, nothing saved, nothing logged) and clears it at the end.
  function staffTour(force) {
    const R = window.RORU, $ = (s) => document.querySelector(s);
    if (!R.tour || $("#main").classList.contains("hide")) return;
    const zh = R.lang() === "zh";
    let sample = null;
    const showSample = () => {
      if (sample || !$("#actions").classList.contains("hide")) return;
      sample = { pp: window.__ppCard, subs: ["#addSub", "#visitSub", "#redeemSub"].map(s => $(s).textContent), dis: ["#addRoll", "#visitBtn", "#redeemBtn"].map(s => $(s).disabled) };
      window.__ppCard = null;
      ["#award", "#pending", "#okToast", "#queue"].forEach(s => { const x = $(s); if (x) x.classList.add("hide"); });
      const ic = '<img class="pp-card-ic" src="/loyalty/img/stampcard_64.png" srcset="/loyalty/img/stampcard_64.png 1x, /loyalty/img/stampcard_128.png 2x" alt="">';
      const g = $("#gcard"); g.classList.remove("hide"); g.dataset.sample = "1";
      g.innerHTML = '<div class="gh"><span class="gn">' + (zh ? "示範客人" : "Sample guest") + '</span><span class="tag-tier t-gohan" style="margin:0">Gohan</span></div>' +
        '<div class="gperks t-gohan"><div class="gp-today">' + (zh ? "今日" : "Today") + ": " + (zh ? "一杯免費 highball" : "a free highball") + '</div><div class="gp-row"><span>' + (zh ? "免費 highball" : "Free highball") + ' <span class="gp-st">· ' + (zh ? "今個月可用" : "available this month") + '</span></span><span><button class="btn sm" type="button" tabindex="-1">' + (zh ? "標記已用" : "Mark used") + "</button></span></div></div>" +
        '<div class="pp-st"><div class="pp-st-h">' + ic + '<div class="pp-st-t"><b>' + (zh ? "護照 5/27" : "Passport 5/27") + "</b><small>" + (zh ? "再集 2 個就換 7 個印花獎品" : "2 more to the 7-stamp prize") + '</small></div><button class="btn sm" type="button" tabindex="-1">' + (zh ? "蓋護照印花" : "Stamp passport") + "</button></div></div>" +
        '<div class="gx muted small">' + (zh ? "呢張係示範卡，教學完就會消失。" : "This is a sample card for the walkthrough. It disappears at the end.") + "</div>";
      $("#addSub").textContent = zh ? "輸入總數同單號" : "type the total + bill no."; $("#visitSub").textContent = zh ? "每日一個" : "one a day"; $("#redeemSub").textContent = zh ? "客人嘅獎賞" : "the guest's rewards";
      ["#addRoll", "#visitBtn", "#redeemBtn"].forEach(s => $(s).disabled = true);
      $("#actions").classList.remove("hide");
    };
    const clearSample = () => {
      if (!sample) return;
      const g = $("#gcard"); g.innerHTML = ""; delete g.dataset.sample; $("#actions").classList.add("hide");
      ["#addSub", "#visitSub", "#redeemSub"].forEach((s, k) => $(s).textContent = sample.subs[k]); ["#addRoll", "#visitBtn", "#redeemBtn"].forEach((s, k) => $(s).disabled = sample.dis[k]);
      window.__ppCard = sample.pp; sample = null;
    };
    const vis = (...sels) => () => { for (const s of sels) { const x = typeof s === "function" ? s() : $(s); if (x && x.offsetParent) return x; } return null; };
    R.tour("staff_f29", [
      { before: clearSample, el: () => $("#disp"), en: "Find a guest by typing their phone number here, or tap Scan QR to read the card on their phone.", zh: "喺度輸入客人電話號碼搵佢，或者撳「掃描 QR」讀佢手機上嘅會員卡。" },
      { before: showSample, el: "#addRoll", en: "Tap ADD BILL to type in the bill total and receipt number when a guest's receipt can't be scanned.", zh: "客人收據掃唔到嘅時候，撳「加單」輸入總數同單號。" },
      { before: showSample, el: "#visitBtn", en: "The bill gives the guest their points, and VISIT ONLY gives one visit stamp a day when there is no bill.", zh: "張單會俾客人積分，冇單嘅時候撳「只蓋到訪印」，每日一個到訪印花。" },
      { before: showSample, el: vis(".gperks", "#redeemBtn"), en: "When a guest shows their flash card, tap Mark used on that perk, or REDEEM for a points reward.", zh: "客人出示閃卡嗰陣，喺嗰個著數撳「標記已用」，積分獎賞就撳「兌換」。" },
      { before: showSample, el: "#logCard", en: "Tapped the wrong thing? Undo it from today's list here, and after the undo window a manager can undo it with a reason.", zh: "撳錯咗？喺今日紀錄度復原；過咗時限就要經理寫低原因先復原到。" },
      { before: showSample, el: vis(".pp-st", "#gcard"), en: "If a receipt didn't stamp the guest's Menu Passport, tap Stamp passport and tick the food from their bill.", zh: "如果收據冇幫客人嘅菜單護照蓋到印花，撳「蓋護照印花」再剔返張單上面嘅食物。" },
      { before: clearSample, el: "#queueBtn", en: "Big or unclear bills wait in To approve, so only approve one that matches the paper bill and leave the rest for the manager or owner.", zh: "大額或者睇唔清嘅單會喺「待批核」等，同張紙單對得上先好批准，其他留俾經理或者老闆。" },
      { before: clearSample, el: "#helpBtn", en: "Tap ? up here any time to see this walkthrough again.", zh: "隨時撳上面嘅 ? 就可以再睇呢個教學。" }
    ], { force: !!force, lang: zh ? "zh" : "en", onEnd: clearSample });
  }
  document.querySelector("#helpBtn").onclick = () => staffTour(true);
</script>
